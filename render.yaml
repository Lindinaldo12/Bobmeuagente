services:
  - type: worker
    name: bob-ai-x
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        value: ${TELEGRAM_BOT_TOKEN}
      - key: GOOGLE_API_KEY
        value: ${GOOGLE_API_KEY}
      - key: OPENROUTER_API_KEY
        value: ${OPENROUTER_API_KEY}
      - key: MODEL_NAME
        value: ${MODEL_NAME}
