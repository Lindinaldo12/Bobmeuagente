services:
  - type: web
    name: bob-ai-x
    runtime: node
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20.18.0"
      - key: TELEGRAM_TOKEN
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: AI_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: AI_MODEL
        value: gemini-2.5-flash
      - key: MASTER_ID
        sync: false
      - key: MAX_HISTORICO
        value: "20"
services:
  - type: web
    name: bob-ai-x
    runtime: node
